<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deep Connect Pro (one computer linked to another)">
  <!-- Left desktop -->
  <rect x="1.4" y="5.2" width="8.2" height="6.2" rx="1.1" stroke="#4D6BFE" stroke-width="1.4"/>
  <path d="M4.1 14.6h3.8" stroke="#4D6BFE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M6 11.4v3.2" stroke="#4D6BFE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M3.1 14.6h5.8" stroke="#4D6BFE" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Right desktop -->
  <rect x="14.4" y="5.2" width="8.2" height="6.2" rx="1.1" stroke="#4D6BFE" stroke-width="1.4"/>
  <path d="M17.1 14.6h3.8" stroke="#4D6BFE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M19 11.4v3.2" stroke="#4D6BFE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M16.1 14.6h5.8" stroke="#4D6BFE" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Link between the two machines, with a lock dot in the middle -->
  <path d="M9.7 8.3h4.6" stroke="#4D6BFE" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1.6 1.5"/>
  <path d="M9.7 8.3h1.1" stroke="#4D6BFE" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M13.2 8.3h1.1" stroke="#4D6BFE" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="8.3" r="1.7" fill="#4D6BFE"/>
  <path d="M12 7.5v.9l.5.4" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ground line joining the two desks -->
  <path d="M2.2 18.2h19.6" stroke="#4D6BFE" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
</svg>
