# Profile layer of the Deep Connect bundle.
#
# One Host row that owns the relay socket, indexes this machine's conversations,
# and answers both the browser panel and the peer machines.
#
# v3 (Pro) is station-based: the panel creates a relay station on one machine and
# hands out an invite link; every other device pastes the link and joins. The
# station's invite token is the key input, so nothing is derived from an account
# and nothing has to be typed on the second machine.
#
# `relayUrl` / `secret` are the pre-v3 fields. They still load for migration, but
# the panel no longer shows them: a station or, failing that, the signed-in
# account decides the room.
- insert:
    - id: deep-connect
      name: '@local/dsh-deep-connect'
      config:
        # State directory: identity, peer roster, remote conversation copies,
        # and the offline outbox all live here.
        root: !!js dshHomePath('deep-connect')
        # Your relay. Set it here or later from the panel.
        relayUrl: !!js process.env.DSH_DEEP_CONNECT_RELAY ?? ''
        # Optional shared passphrase. Empty means "derive from the account".
        secret: !!js process.env.DSH_DEEP_CONNECT_SECRET ?? ''
        # How often the index is rebuilt and broadcast, in milliseconds.
        indexIntervalMs: 15000
        # Pull every peer conversation body as soon as a peer appears.
        # Set to false to go back to fetch-on-click.
        autoSyncHistory: true
        # Upper bound on sessions auto-pulled per peer index broadcast.
        maxSyncSessions: 300
